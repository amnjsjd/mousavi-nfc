<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوازم اصلاح و خانگی موسوی</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap');

    body {
      margin: 0;
      font-family: 'Vazirmatn', sans-serif;
      background-color: #000;
      color: #00ff99;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
      max-width: 380px;
      width: 90%;
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    img.logo {
      width: 120px;
      margin-bottom: 20px;
      border-radius: 50%;
      border: 2px solid #D4AF37;
      padding: 10px;
      background-color: white;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 10px;
      color: #00ff99;
    }

    p.address {
      font-size: 0.9rem;
      color: #D4AF37;
      margin-bottom: 25px;
    }

    .btn {
      display: block;
      width: 100%;
      background-color: #fff;
      color: #000;
      padding: 12px 0;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background-color: #00ff99;
      color: #000;
      transform: translateY(-3px);
      box-shadow: 0 0 15px #00ff99;
    }

    footer {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://i.ibb.co/wN3YtH0/mosavi-logo.png" alt="لوازم خانگی موسوی" class="logo" />
    <h1>لوازم اصلاح و خانگی موسوی</h1>
    <p class="address">استان بوشهر، بندر گناوه، چهارراه توپ، پاساژ سپنتا</p>

    <a href="tel:09306218138" class="btn">📞 تماس مستقیم</a>
    <a href="https://wa.me/message/P5YAZGJZDUZTP1" class="btn">💬 واتساپ</a>
    <a href="https://t.me/the_only_man_in_sky" class="btn">📩 تلگرام</a>
    <a href="https://www.instagram.com/kitchen.genaveh?igsh=MTZiOTFjNHJtcTc4cQ==" class="btn">📸 اینستاگرام</a>
  </div>

  <footer>© 2025 Mousavi Appliances</footer>
</body>
</html>
